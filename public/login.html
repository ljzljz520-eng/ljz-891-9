<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台登录 - 品牌经销资质查询系统</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="app">
    <div class="login-wrap">
      <div class="login-card">
        <h1>管理后台</h1>
        <p class="sub">品牌经销资质查询系统</p>
        <div class="login-error" :class="{ show: error }">{{ error }}</div>
        <form @submit.prevent="doLogin">
          <div class="field">
            <label>用户名</label>
            <input v-model="form.username" type="text" placeholder="请输入用户名" required autofocus>
          </div>
          <div class="field">
            <label>密码</label>
            <input v-model="form.password" type="password" placeholder="请输入密码" required>
          </div>
          <button type="submit" class="btn btn-primary" :disabled="loading">
            {{ loading ? '登录中...' : '登 录' }}
          </button>
        </form>
        <p style="text-align:center;margin-top:20px;font-size:13px;"><a href="/" style="color:#3b82f6;">← 返回查询首页</a></p>
      </div>
    </div>
  </div>

  <script>
    const { createApp, ref } = Vue;
    createApp({
      setup() {
        const form = ref({ username: '', password: '' });
        const loading = ref(false);
        const error = ref('');

        const doLogin = async () => {
          loading.value = true;
          error.value = '';
          try {
            const resp = await fetch('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(form.value)
            });
            const data = await resp.json();
            if (data.success) {
              localStorage.setItem('token', data.data.token);
              localStorage.setItem('admin', JSON.stringify(data.data.admin));
              window.location.href = '/admin';
            } else {
              error.value = data.message || '登录失败';
            }
          } catch (e) {
            error.value = '网络错误，请稍后重试';
          } finally {
            loading.value = false;
          }
        };

        return { form, loading, error, doLogin };
      }
    }).mount('#app');
  </script>
</body>
</html>
