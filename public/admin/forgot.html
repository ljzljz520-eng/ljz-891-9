<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>找回密码 - 品牌经销资质系统</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header"><div class="wrap"><a class="brand" href="/"><span class="logo">🏷️</span>品牌经销资质查询平台</a></div></header>

<div class="login-wrap">
  <div class="card">
    <div class="login-logo">📧</div>
    <h2 class="center" style="margin-top:0">找回登录密码</h2>
    <p class="muted center">输入用户名，系统将向该账号登记的邮箱发送重置链接（15 分钟内有效）。</p>
    <div id="alertBox"></div>
    <form id="forgotForm">
      <div class="form-row">
        <label>用户名</label>
        <input type="text" id="username" required>
      </div>
      <button class="btn btn-block" type="submit" id="submitBtn">发送重置邮件</button>
    </form>
    <p class="center mt-4"><a href="login.html">返回登录</a></p>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const box = document.getElementById('alertBox');
  const btn = document.getElementById('submitBtn');
  btn.disabled = true; btn.textContent = '发送中…';
  try {
    const resp = await API.post('/api/auth/forgot-password', {
      username: document.getElementById('username').value.trim(),
    });
    box.innerHTML = `<div class="alert alert-success">${escapeHtml(resp.message)}</div>`;
  } catch (err) {
    box.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
  } finally {
    btn.disabled = false; btn.textContent = '发送重置邮件';
  }
});
</script>
</body>
</html>
