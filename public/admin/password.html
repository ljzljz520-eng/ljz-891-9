<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修改密码 - 资质管理后台</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="admin-shell" id="adminShell"></div>

<template id="pageContent">
  <div class="page-title"><h1>修改登录密码</h1></div>
  <div class="panel" style="max-width:460px">
    <div id="alertBox"></div>
    <form id="pwdForm">
      <div class="form-row">
        <label>原密码</label>
        <input type="password" id="oldPwd" autocomplete="current-password" required>
      </div>
      <div class="form-row">
        <label>新密码 <span class="hint">（8-64 位）</span></label>
        <input type="password" id="newPwd" minlength="8" autocomplete="new-password" required>
      </div>
      <div class="form-row">
        <label>确认新密码</label>
        <input type="password" id="newPwd2" minlength="8" autocomplete="new-password" required>
      </div>
      <button class="btn" type="submit" id="saveBtn">保存新密码</button>
    </form>
  </div>
</template>

<script src="/js/common.js"></script>
<script src="admin.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('pwdForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const box = document.getElementById('alertBox');
    box.innerHTML = '';
    const o = document.getElementById('oldPwd').value;
    const p1 = document.getElementById('newPwd').value;
    const p2 = document.getElementById('newPwd2').value;
    if (p1 !== p2) { box.innerHTML = '<div class="alert alert-error">两次输入的新密码不一致</div>'; return; }
    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    try {
      const resp = await API.post('/api/auth/change-password', { old_password: o, new_password: p1 });
      box.innerHTML = `<div class="alert alert-success">${escapeHtml(resp.message)}</div>`;
      document.getElementById('pwdForm').reset();
    } catch (err) {
      box.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
    } finally {
      btn.disabled = false;
    }
  });
});
</script>
</body>
</html>
