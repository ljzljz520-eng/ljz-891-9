<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品牌经销资质查询</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/"><span class="logo">🏷️</span>品牌经销资质查询平台</a>
    <a class="header-link" href="/admin/login.html">管理员登录 →</a>
  </div>
</header>

<main class="wrap">
  <div class="hero">
    <h1>经销授权资质查询</h1>
    <p>输入经销商名称与门店编号，即可查询授权品牌、区域、有效期等信息</p>
  </div>

  <section class="card">
    <div id="alertBox"></div>
    <form id="queryForm">
      <div class="form-row">
        <label for="dealerName">经销商名称 <span class="hint">（支持名称关键字模糊匹配）</span></label>
        <input type="text" id="dealerName" maxlength="128" placeholder="例如：华东电器有限公司" autocomplete="organization">
      </div>
      <div class="form-row">
        <label for="storeCode">门店编号 <span class="hint">（需与授权登记完全一致）</span></label>
        <input type="text" id="storeCode" maxlength="64" placeholder="例如：SH-001" autocomplete="off">
      </div>
      <button type="submit" class="btn btn-block" id="queryBtn">🔍 查询资质</button>
    </form>
  </section>

  <section id="resultSection" class="card" style="display:none"></section>

  <p class="center muted" style="margin:30px 0 40px">
    查询结果仅供参考，授权状态以品牌方最新登记为准。如有疑问请联系上级代理。
  </p>
</main>

<script src="/js/common.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
