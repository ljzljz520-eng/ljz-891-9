<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重置密码 · {{ SITE_NAME }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="auth-body">
<div class="auth-card">
  <div class="auth-brand"><span class="brand-mark-sm">盾</span> 设置新密码</div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}<div class="flash flash-{{ category }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label class="auth-label">新密码（至少 8 位）</label>
    <input class="auth-input" type="password" name="password" required minlength="8">
    <label class="auth-label">确认新密码</label>
    <input class="auth-input" type="password" name="password2" required minlength="8">
    <button class="btn-primary btn-block" type="submit">重置密码</button>
  </form>
</div>
</body>
</html>
