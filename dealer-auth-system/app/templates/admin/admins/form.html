{% extends "admin/base.html" %}
{% block title %}{{ '编辑管理员' if mode == 'edit' else '新增管理员' }}{% endblock %}
{% block page_title %}{{ '编辑管理员' if mode == 'edit' else '新增管理员' }}{% endblock %}
{% block body %}
<div class="panel" style="max-width:600px">
  <div class="panel-body">
    <form method="post" class="form"
          action="{{ url_for('admin.admin_edit', admin_id=admin_id) if mode == 'edit' else url_for('admin.admin_new') }}">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="form-row">
        <label>用户名 <i>*</i></label>
        <input class="input" name="username" required minlength="3" maxlength="64"
               value="{{ a.username if a.username is defined else '' }}" {{ 'disabled' if mode == 'edit' }}>
      </div>
      <div class="form-row">
        <label>显示名称</label>
        <input class="input" name="display_name" maxlength="64"
               value="{{ a.display_name if a.display_name is defined else '' }}">
      </div>
      <div class="form-row">
        <label>邮箱（用于接收开通通知 / 找回密码）</label>
        <input class="input" type="email" name="email"
               value="{{ a.email if a.email is defined else '' }}">
      </div>
      <div class="form-row">
        <label>角色</label>
        <select class="input" name="role">
          <option value="operator" {{ 'selected' if (a.role if a.role is defined else 'operator') == 'operator' }}>运营管理员（仅维护资质）</option>
          <option value="admin" {{ 'selected' if a.role is defined and a.role == 'admin' }}>超级管理员（全部权限）</option>
        </select>
      </div>
      <div class="form-row">
        <label>{{ '重置密码' if mode == 'edit' else '初始密码' }}（至少 8 位）</label>
        <input class="input" type="password" name="password" minlength="8"
               {{ '' if mode == 'edit' else 'required' }} autocomplete="new-password"
               placeholder="{{ '留空表示不修改' if mode == 'edit' else '' }}">
      </div>
      <div class="form-row">
        <label class="remember"><input type="checkbox" name="active"
          {{ 'checked' if mode == 'new' or (a.active if a.active is defined else True) }}> 账号启用</label>
      </div>
      <div class="form-actions">
        <button class="btn-primary" type="submit">保存</button>
        <a class="btn-ghost" href="{{ url_for('admin.admin_list') }}">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
