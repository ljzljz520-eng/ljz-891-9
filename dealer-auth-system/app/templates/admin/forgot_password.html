<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找回密码 · {{ SITE_NAME }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="auth-body">
<div class="auth-card">
  <div class="auth-brand"><span class="brand-mark-sm">盾</span> 找回管理员密码</div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, msg in messages %}<div class="flash flash-{{ category }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label class="auth-label">账号邮箱</label>
    <input class="auth-input" type="email" name="email" required value="{{ email_sent_to or '' }}"
           placeholder="开通账号时登记的邮箱">
    <button class="btn-primary btn-block" type="submit">发送重置链接</button>
  </form>
  <div class="auth-links"><a href="{{ url_for('admin.login') }}">← 返回登录</a></div>
</div>
</body>
</html>
