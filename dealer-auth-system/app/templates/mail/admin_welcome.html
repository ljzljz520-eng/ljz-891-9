<div style="font-family:'PingFang SC','Microsoft YaHei',sans-serif;max-width:560px;margin:auto;color:#1f2937">
  <h2 style="color:#1d4ed8">管理员账号已开通</h2>
  <p>您好，{{ admin.display_name or admin.username }}：</p>
  <p>您的资质管理后台账号已创建，信息如下，请妥善保管并尽快登录修改密码：</p>
  <table style="border-collapse:collapse;margin:16px 0">
    <tr><td style="padding:6px 16px 6px 0;color:#6b7280">登录地址</td><td><a href="{{ login_url }}">{{ login_url }}</a></td></tr>
    <tr><td style="padding:6px 16px 6px 0;color:#6b7280">用户名</td><td><b>{{ admin.username }}</b></td></tr>
    <tr><td style="padding:6px 16px 6px 0;color:#6b7280">初始密码</td><td><b>{{ password }}</b></td></tr>
    <tr><td style="padding:6px 16px 6px 0;color:#6b7280">角色</td><td>{{ admin.role_label }}</td></tr>
  </table>
  <p style="color:#dc2626;font-size:13px">本邮件包含敏感信息，请登录后立即在「个人资料」中修改密码。</p>
  <hr style="border:none;border-top:1px solid #e5e7eb;margin:24px 0">
  <p style="color:#9ca3af;font-size:12px">{{ SITE_NAME }}</p>
</div>
