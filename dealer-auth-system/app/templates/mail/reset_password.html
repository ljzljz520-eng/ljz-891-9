<div style="font-family:'PingFang SC','Microsoft YaHei',sans-serif;max-width:560px;margin:auto;color:#1f2937">
  <h2 style="color:#1d4ed8">重置管理员密码</h2>
  <p>您好，{{ admin.display_name or admin.username }}：</p>
  <p>我们收到了您重置后台管理密码的请求，请在 <b>{{ expiry_minutes }} 分钟</b> 内点击下方按钮设置新密码：</p>
  <p style="margin:28px 0"><a href="{{ reset_url }}"
     style="background:#1d4ed8;color:#fff;text-decoration:none;padding:12px 28px;border-radius:8px;display:inline-block">重置密码</a></p>
  <p style="word-break:break-all;color:#6b7280;font-size:13px">如按钮无法点击，请复制链接：<br>{{ reset_url }}</p>
  <p style="color:#6b7280;font-size:13px">若非本人操作，请忽略本邮件，您的密码不会改变。</p>
  <hr style="border:none;border-top:1px solid #e5e7eb;margin:24px 0">
  <p style="color:#9ca3af;font-size:12px">{{ SITE_NAME }}</p>
</div>
